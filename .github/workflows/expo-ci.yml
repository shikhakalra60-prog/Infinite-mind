name: Expo CI

on:
  push:
    branches: [ main, '**' ]
  workflow_dispatch: {}

jobs:
  setup-and-test:
    name: Install & test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run sanity check (start in non-interactive mode)
        run: |
          npx expo --version || true
          echo "Dependencies installed"

  publish-expo:
    name: Publish to Expo (optional)
    needs: setup-and-test
    runs-on: ubuntu-latest
    if: ${{ secrets.EXPO_TOKEN != '' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Publish to Expo
        run: npx expo publish --non-interactive

  eas-build:
    name: EAS Build (optional)
    needs: setup-and-test
    runs-on: ubuntu-latest
    if: ${{ secrets.EAS_ACCESS_TOKEN != '' }}
    env:
      EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run EAS build (all platforms)
        run: eas build --platform all --non-interactive
        env:
          EAS_BUILD_AUTOMATIC_PLATFORM_ALLOCATION: '1'
